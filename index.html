<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN</title>
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Smythe&display=swap" rel="stylesheet">
</head>

<body>
  <header>

  </header>

  <main>

     <h1 class="animate__animated animate__fadeInTopLeft">SOMOS GARDEN DESIGN</h1>
    <section>
      <p class="animate__animated animate__fadeInBottomRight">REGISTRATE PARA CONOCER NUESTROS PRODUCTOS</p>

      <div id="empty_email_error" class="error"></div>
      <div id="empty_psw_error" class="error"></div>
      <div id="login_error_error" class="error"></div>
      <form id="form_login" novalidate>
        <input id="id_mail" type="email" placeholder="Ingrese su email"> <br>
        <input id="id_psw" type="password" name="pass" id="pass" placeholder="Ingrese su contraseña"> <br>
        <button type="button" id="btn_login">Ingresar</button>
      </form>
    </section>
  </main>

  <footer>
  </footer>

  <script src="js/login.js"></script>

</body>

  
</html>
